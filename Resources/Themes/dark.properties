# Dark/terminal theme - proves live theme switching actually works end to end

# Embedded fonts, referenced by name from the *.font lines below
font.embed.shareTechMono = Resources/Themes/fonts/ShareTechMono-Regular.ttf

button.main = #333333
button.hover = #FF8800
button.disabled = #555555
button.text = #FFFFFF
button.border = #000000
# cornerArc = arc diameter in px for rounded corners (0 = square)
button.cornerArc = 0
button.font = shareTechMono,BOLD,18

cell.main = #222222
cell.hover = #444444
cell.text = #00FF00
cell.border = #00FF00
cell.cornerArc = 0
cell.font = shareTechMono,BOLD,18

field.background = #111111
field.readOnly = #1A1A1A
field.border = #00FF00
field.borderFocused = #00FFFF
field.placeholder = #556655
field.caret = #00FF00
field.selection = #005500
field.selectedText = #FFFFFF
field.text = #00FF00
field.cornerArc = 0
field.font = shareTechMono,PLAIN,13

# Buttons that move around the app: the State row, the tabs and the header's actions
nav.main = #222222
nav.hover = #444444
nav.selected = #00AA00
nav.text = #00FF00
nav.selectedText = #000000
nav.disabledText = #556655
nav.border = #00FF00
nav.countBackground = #003300
nav.countText = #00CC00
nav.cornerArc = 0
nav.font = shareTechMono,BOLD,14

title.text = #00FF00
title.font = shareTechMono,BOLD,32

heading.text = #00FF00
heading.font = shareTechMono,BOLD,14

background = #000000

# Formatted text: the colours a writer can pick (kept in a review by name), the bold, link and list number colours, and the other two fonts
rich.colour.gold = #E8C870
rich.colour.amber = #F0B070
rich.colour.red = #F08A7C
rich.colour.green = #9FD8A6
rich.colour.blue = #9CC7EC
rich.colour.sand = #B8A98C
rich.boldText = #AAFFAA
rich.link = #00FFFF
rich.linkUnderline = #007777
rich.marker = #00AA00
rich.font.serif = Georgia,PLAIN,14
rich.font.mono = shareTechMono,PLAIN,13
rich.font.marker = shareTechMono,PLAIN,12
