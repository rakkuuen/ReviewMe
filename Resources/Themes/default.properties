# Default theme - matches the app's original hardcoded look before theming existed

# Embedded fonts, referenced by name from the *.font lines below
font.embed.shareTechMono = Resources/Themes/fonts/ShareTechMono-Regular.ttf

button.main = #0000FF
button.hover = #FF0000
button.disabled = #808080
button.text = #FFFFFF
button.border = #000000
# cornerArc = arc diameter in px for rounded corners (0 = square)
button.cornerArc = 10
button.font = Arial,BOLD,18

cell.main = #FFFFFF
cell.hover = #808080
cell.text = #000000
cell.border = #000000
cell.cornerArc = 10
cell.font = Arial,BOLD,18

field.background = #FFFFFF
field.readOnly = #EBEBEB
field.border = #000000
field.borderFocused = #1E78DC
field.placeholder = #808080
field.caret = #000000
field.selection = #B8CFE5
field.selectedText = #000000
field.text = #000000
field.cornerArc = 10
field.font = Arial,PLAIN,13

# Buttons that move around the app: the State row, the tabs and the header's actions
nav.main = #FFFFFF
nav.hover = #D9D9D9
nav.selected = #0000FF
nav.text = #000000
nav.selectedText = #FFFFFF
nav.disabledText = #808080
nav.border = #000000
nav.countBackground = #D0D0D0
nav.countText = #333333
nav.cornerArc = 10
nav.font = Arial,BOLD,14

title.text = #000000
title.font = Arial,BOLD,32

heading.text = #000000
heading.font = Arial,BOLD,14

background = #EEEEEE

# Formatted text: the colours a writer can pick (kept in a review by name), the bold, link and list number colours, and the other two fonts
rich.colour.gold = #8A6A00
rich.colour.amber = #B05A00
rich.colour.red = #C0392B
rich.colour.green = #2E7D32
rich.colour.blue = #1565C0
rich.colour.sand = #7A6A4F
rich.boldText = #000000
rich.link = #1565C0
rich.linkUnderline = #8FB0DC
rich.marker = #0000FF
rich.font.serif = Georgia,PLAIN,14
rich.font.mono = shareTechMono,PLAIN,12
rich.font.marker = Arial,PLAIN,12
