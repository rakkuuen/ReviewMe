# Every size the screens use, in pixels (counts for the two overview.* keys marked below).
# Strict: every key must be here exactly once, and nothing else. A theme file can override any of them by writing
# layout.<name> = <number> (for example layout.shell.padding = 12). See Model/Layout/LayoutKey.java for the allowed ranges.

# --- The window ---
window.startWidth = 1280
window.startHeight = 800
window.minWidth = 720
window.minHeight = 560
# Below this width the Overview and lists use their narrow layout
window.narrowBreakpoint = 900

# --- The frame around every screen ---
shell.padding = 24
shell.gap = 16
shell.headerHeight = 64
shell.stateRowHeight = 44
shell.tabBarHeight = 44
shell.itemPaddingX = 16
shell.itemGap = 8
# How long a short message (like Saved) stays on screen, in milliseconds
shell.toastMillis = 2500

# --- Game lists ---
list.rowHeight = 64
list.rowGap = 8
list.scrollStep = 40
list.bottomPadding = 40
list.searchWidth = 320
# How many rows a list shows before "Show more" (a count, not pixels)
list.pageSize = 25

# --- The Overview ---
# How many rows each short list shows before "View all" (a count, not pixels)
overview.rowsPerSection = 8
# How many Top picks slots there are, 1 to 5 (a count, not pixels)
overview.topPickSlots = 5
overview.statCardHeight = 112
# Stat cards wrap onto another line rather than get narrower than this
overview.statCardMinWidth = 112
overview.cardPadding = 16
overview.sectionGap = 24
overview.columnGap = 24
overview.sectionHeaderHeight = 32
# The Top picks panel beside the stats (it drops below them in a narrow window), and the height of each of its rows
overview.sidePanelWidth = 380
overview.topPickRowHeight = 40
# The completed-per-year chart: how many years (a count), and the size of its bars
overview.chartYears = 5
overview.chartBarWidth = 12
overview.chartBarGap = 6
overview.chartHeight = 40
# How far a series' games sit in under its heading
overview.seriesIndent = 24
